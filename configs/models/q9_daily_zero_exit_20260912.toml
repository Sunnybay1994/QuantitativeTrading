conclusion = "PAPER_CANDIDATE only if execution and economic criteria pass, otherwise RESEARCH_ONLY if execution passes, REJECTED otherwise"
report = "target-deviation weight-days, retry trades/rejections, cash exposure, CAGR/Sharpe/drawdown/turnover, shared holding window and return-index benchmarks"
