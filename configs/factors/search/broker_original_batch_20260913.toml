source_ref = "https://file.iyanbao.com/pdf/034a0-f62a88b5-eb5e-4618-86cc-fdb816341902.pdf PDF p8; raw GTR precursor; local ddof=0 and complete 20 sessions, zero previous turnover missing; original size-only neutralization differs from battery size-industry variant."
