batch = "minute_low_frequency_nine"
source = "baostock"
frequency = "5m"
required_bars_per_day = 48
window_sessions = 20
return_definition = "log(close/previous_intraday_close); first bar uses own open; no overnight gap"
missing_day = "null; require all 20 consecutive exchange sessions"
maximum_daily_close_error = 0.01
maximum_daily_volume_relative_error = 0.01
maximum_daily_amount_relative_error = 0.01
coverage = "all available local stock histories; absent histories remain null in full-market panel"
selection = "P3 battery thresholds; no selection from short-window portfolio returns"

[formulas]
tail_amount = "sum(amount from 14:30)/sum(amount)"
open_amount = "sum(amount before 10:00)/sum(amount)"
smart_vwap = "VWAP of 10 largest abs(log_return)/sqrt(volume) bars divided by full-day VWAP; chronological ties"
skew = "sqrt(48)*sum(r^3)/sum(r^2)^1.5; null when sum(r^2)=0"
realized_vol = "sqrt(sum(r^2)); not annualized"
kurtosis = "48*sum(r^4)/sum(r^2)^2; raw moment, not excess; null when sum(r^2)=0"
open_return = "close at 10:00 / open at 09:30 - 1"
volume_return_corr = "Pearson correlation of 48 log returns and volumes; null for zero variance"
return_autocorr = "Pearson correlation of r[1:48] and r[0:47]; null for zero variance"

[directions]
tail_amount = 1
open_amount = -1
smart_vwap = -1
skew = -1
realized_vol = -1
kurtosis = -1
open_return = -1
volume_return_corr = -1
return_autocorr = -1
