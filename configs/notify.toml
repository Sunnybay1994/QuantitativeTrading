# 人工通知。密钥一律走环境变量，不要把 webhook/密码写进本文件。
# DEEPSEEK_API_KEY / SMTP_PASSWORD / SMTP_HOST / SMTP_FROM / SMTP_TO
# WECOM_WEBHOOK / FEISHU_WEBHOOK / WXAUTO_GROUP

[notify]
enabled = true
# 公开默认留空；运行时叠加 notify.local.dpapi 的本机加密设置。
# 有效通道仍为空时写入 artifacts/notify/outbox.jsonl；可选 email / wecom / feishu / feishu_app / wxauto。
channels = []

[email]
smtp_host = ""
smtp_port = 587
from_addr = ""
to_addrs = []
username = ""

[wxauto]
group = ""
