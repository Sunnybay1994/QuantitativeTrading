# S4 event tables. Registered before the backfill. Do not score these columns this round.
id = "event_family_v1"
registered_on = 2026-10-27
auto_trade = false
evaluate_this_round = false
families = ["repurchase", "insider_trading"]
first_backfill = "2024-01-01"
full_coverage_target = "2019-01-01"
pit = "Eligibility uses known_at; age windows use original publication date. Current structured snapshots never backdate availability. Later corrections append new rows."
structured_duplicate_policy = "Before factor aggregation, deduplicate shared structured source_row_id across documents; retain announced progress provenance and do not sum cumulative repurchase totals repeatedly. No factor evaluation this round."
llm_task = "event_extract"
max_input_chars = 1500
max_tokens = 250
month_budget_usd = 5.0
month_budget_overrides_usd = { "2026-11" = 2.0 }
unresolved = "Missing or unparsable amount, ratio, term, or direction stays null. Do not impute."
factors = ["repurchase_strength_30d", "repurchase_strength_90d", "insider_net_buy_90d"]
factor_note = "Repurchase strength is the 30/90 day sum of amount_cny divided by market cap. Insider net buy is 90 day buy amount minus sell amount. Evaluation is the next round."

[structured_inputs]
registered_on = 2026-11-05
reader = "quant.data.event_family_inputs.read_event_source"
tables = ["repurchase", "stk_holdertrade", "share_float", "stk_holdernumber"]
publication = "Only snapshots with summary.json; eligibility requires available_at and observed_at no later than observation cutoff"
unlock = "Preserve float_date, holder_name, share_type, native float_share shares and float_ratio percent; no holder sum or new factor"
holder_count = "Preserve report end_date and announced holder_num households; never sum counts across periods"
evaluation = "Input consumption only; original families and factor definitions unchanged, evaluate_this_round=false"
