[research]
hypothesis_id = "b35-lowvol-filter-reversal-monthly-top50-20260909"
hypothesis = "Adding a fixed bottom-30-percent 60-session realized-volatility filter before the existing 20-session reversal Top50 ranking improves compounded 1x return versus the same-complete-pool unfiltered reversal strategy, while both 1x and 2x returns remain positive. No parameter search."
strategy_name = "b35_lowvol_reversal_top50"
strategy_version = "v1"
random_seed = 20260909

[data]
refresh_config = "configs/data/refresh.toml"
warmup_start = 2023-01-01
research_start = 2023-07-01
research_end = 2026-09-08

[universe]
name = "liquid_top800_2019"
freeze_start = 2019-01-01
freeze_end = 2019-12-31
top_n = 800
minimum_observations = 120
minimum_average_amount = 20000000.0

[factors]
names = ["reversal_20"]
directions = [1]
minimum_history_rows = 120
minimum_daily_symbols = 100

[composite]
method = "equal_weight_zscore_monthly"
standard_deviation_ddof = 0
zero_variance_component = "zero"
missing_component = "exclude_symbol"
winsorization = "none"

[portfolio]
top_k = 50
initial_cash = 1000000.0
cost_multipliers = [0.5, 1.0, 2.0]
rebalance = "month_end_close_next_session_open"
benchmark = "510300.SH"
benchmark_rebalance = "buy_and_hold"
stock_dividend_withholding = 0.20
# Unsold holdings are written down fully on the first session after delisting.
# Added during execution-data debugging, before any fold results were produced.
delisted_holding_recovery = 0.0
initial_signal = "previous_session_close"

[costs.a_share]
commission_rate = 0.00025
commission_min = 5.0
stamp_tax_sell = 0.0005
transfer_fee = 0.00001
slippage = 0.001
effective_from = 2023-08-28

[costs.etf]
commission_rate = 0.00025
commission_min = 5.0
slippage = 0.001
effective_from = 2023-01-01

[admission]
comparison = "reversal_unfiltered"
positive_net_return_1x = true
positive_net_return_2x = true
positive_paired_compound_increment_1x = true
maximum_conclusion = "RESEARCH_ONLY"
# Earlier factor periods have already been inspected; keep the fixed historical conclusion ceiling.

[low_volatility_filter]
column = "realized_volatility_60"
keep_fraction = 0.30
rounding = "ceiling"
ties = "symbol_ascending"
minimum_candidates = 50
ranking = "reversal_20_descending_within_low_vol_pool"
paired_pool = "same_historical_name_liquidity_history_and_complete_volatility_reversal_rows"

[eligibility]
historical_exchange_name = true
exclude_st_or_delisting_name = true
unknown_historical_name = "exclude"

[b3]
reversal_window_sessions = 20
volatility_window_sessions = 60
ivol_window_sessions = 60
annualization_sessions = 252
ivol_model = "local_market_size_value_proxy"
ivol_residual_degrees_of_freedom = 4
proxy_sort = "prior_month_end_size_median_and_book_to_market_30_70"
proxy_weight = "previous_session_total_market_value"
proxy_minimum_bucket_symbols = 10
risk_free_return_assumption = 0.0
missing_session = "invalidate_rolling_window"

[[walk_forward.folds]]
train_start = 2023-07-01
train_end = 2023-09-30
validation_start = 2023-10-01
validation_end = 2023-12-31
test_start = 2024-01-01
test_end = 2024-12-31

[[walk_forward.folds]]
train_start = 2023-07-01
train_end = 2023-12-31
validation_start = 2024-01-01
validation_end = 2024-12-31
test_start = 2025-01-01
test_end = 2025-12-31

[[walk_forward.folds]]
train_start = 2023-07-01
train_end = 2024-12-31
validation_start = 2025-01-01
validation_end = 2025-12-31
test_start = 2026-01-01
test_end = 2026-09-08
