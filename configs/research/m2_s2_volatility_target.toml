[meta]
config_version = "1.3.0"
purpose = "M2 S2 monthly regime trend with an unlevered volatility target"

[research]
hypothesis_id = "s2-monthly-volatility-target-v1"
hypothesis = "Using only a 60-observation 12% annualized unlevered volatility target on the monthly regime-filtered ETF portfolio can reduce maximum drawdown in both frozen test folds while preserving positive net returns in both folds, without changing data, universe, selection, signal cadence, regime filter, or costs."
strategy_kind = "etf_regime_trend"
strategy_version = "1.2.0"
conclusion = "RESEARCH_ONLY"
random_seed = 0

[data]
historical_raw_price_source = "akshare_sina"
incremental_raw_price_source = "baostock"
dividend_source = "akshare_sina"
adjustment = "total_return_dividend"
start_date = 2023-01-01
end_date = 2026-07-10
minimum_history_observations = 121

[universe]
name = "ETF_POOL_M2_V1"
frozen_as_of = 2026-07-12
wide = ["510300.SH", "159919.SZ", "510500.SH", "159922.SZ"]
industry = ["512880.SH", "512170.SH", "515790.SH"]
hong_kong_theme = ["513060.SH", "513330.SH", "513180.SH", "159920.SZ"]

[strategy.equal_weight]
rebalance = "month_end_signal_next_session_open"
cash_buffer = 0.00

[strategy.etf_regime_trend]
regime_symbol = "510300.SH"
momentum_windows = [20, 60, 120]
regression_window = 60
top_k = 2
cash_buffer = 0.10
factor_version = "trend_v1"
signal_timing = "close"
execution_timing = "next_session_open"

[strategy.etf_regime_trend.volatility_target]
lookback_observations = 60
annualized_volatility = 0.12
annualization_sessions = 252

[backtest]
initial_cash = 1000000.0
valuation_timing = "close"
execution_timing = "next_session_open"

[benchmark.csi300]
symbol = "000300.SH"
tracked_etf = "510300.SH"
official_as_of = 2026-03-31
official_ytd_return = -0.0389
official_tolerance = 0.0001
official_source = "https://oss-ch.csindex.com.cn/static/html/csindex/public/uploads/indices/detail/files/en/000300factsheeten.pdf"

[walk_forward]
enabled = true
train_months = 24
validation_months = 6
test_months = 6
step_months = 6
selection_metric = "net_sharpe"
cost_multipliers = [0.5, 1.0, 2.0]

[walk_forward.grid]
top_k = [1, 2, 3]
regression_window = [40, 60, 90]

[costs.a_share]
commission_rate = 0.00025
commission_min = 5.0
stamp_tax_sell = 0.0005
transfer_fee = 0.00001
slippage = 0.001
effective_from = 2026-01-01

[costs.etf]
commission_rate = 0.00025
commission_min = 5.0
slippage = 0.001
effective_from = 2023-01-01
