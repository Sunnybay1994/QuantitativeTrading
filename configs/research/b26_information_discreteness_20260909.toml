[research]
hypothesis_id = "b26-information-discreteness-monthly-top50-20260909"
hypothesis = "Within the same top-quintile 252-session past-return winner pool after skipping 21 sessions, selecting low information discreteness instead of highest past return improves monthly Top50 cost-adjusted returns. Monthly rebalancing and fixed exchange-session windows are local adaptations of the original six-month holding study."
strategy_name = "b26_information_discreteness_top50"
strategy_version = "v1"
random_seed = 20260909

[data]
refresh_config = "configs/data/refresh.toml"
warmup_start = 2023-01-01
research_start = 2023-07-01
research_end = 2026-09-08

[universe]
name = "liquid_top800_2019"
freeze_start = 2019-01-01
freeze_end = 2019-12-31
top_n = 800
minimum_observations = 120
minimum_average_amount = 20000000.0

[factors]
names = ["information_discreteness"]
directions = [-1]
minimum_history_rows = 120
minimum_daily_symbols = 50

[composite]
method = "equal_weight_zscore_monthly"
standard_deviation_ddof = 0
zero_variance_component = "zero"
missing_component = "exclude_symbol"
winsorization = "none"

[portfolio]
top_k = 50
initial_cash = 1000000.0
cost_multipliers = [0.5, 1.0, 2.0]
rebalance = "month_end_close_next_session_open"
benchmark = "510300.SH"
benchmark_rebalance = "buy_and_hold"
stock_dividend_withholding = 0.20
# Unsold holdings are written down fully on the first session after delisting.
# Added during execution-data debugging, before any fold results were produced.
delisted_holding_recovery = 0.0
initial_signal = "previous_session_close"

[costs.a_share]
commission_rate = 0.00025
commission_min = 5.0
stamp_tax_sell = 0.0005
transfer_fee = 0.00001
slippage = 0.001
effective_from = 2023-08-28

[costs.etf]
commission_rate = 0.00025
commission_min = 5.0
slippage = 0.001
effective_from = 2023-01-01

[admission]
minimum_mean_test_rank_ic = 0.03
minimum_positive_test_folds = 2
maximum_absolute_rank_correlation = 0.8
redundancy_references = ["pret_12m_skip1m", "alpha158_std20", "alpha158_roc20", "alpha158_rsv20"]
maximum_conclusion = "RESEARCH_ONLY"
# Fixed before results: conditional factor admission plus paired strategy improvement.
minimum_positive_paired_excess_folds = 2
minimum_compounded_paired_excess_1x = 0.0
minimum_compounded_net_return_2x = 0.0
# All improvement/return thresholds above are strict; equal returns do not pass.

[eligibility]
historical_exchange_name = true
exclude_st_or_delisting_name = true
unknown_historical_name = "exclude"

[[walk_forward.folds]]
train_start = 2023-07-01
train_end = 2023-09-30
validation_start = 2023-10-01
validation_end = 2023-12-31
test_start = 2024-01-01
test_end = 2024-12-31

[[walk_forward.folds]]
train_start = 2023-07-01
train_end = 2023-12-31
validation_start = 2024-01-01
validation_end = 2024-12-31
test_start = 2025-01-01
test_end = 2025-12-31

[[walk_forward.folds]]
train_start = 2023-07-01
train_end = 2024-12-31
validation_start = 2025-01-01
validation_end = 2025-12-31
test_start = 2026-01-01
test_end = 2026-09-08

[information_discreteness]
formation_history_start = 2022-01-01
formation_sessions = 252
skip_sessions = 21
formula = "sign(PRET) * (negative_days - positive_days) / 252"
pret_formula = "adjusted_close[t-21] / adjusted_close[t-273] - 1"
return_indices = "t-272 through t-21 inclusive"
minimum_valid_returns = 252
missing_session = "null_entire_formation_window"
zero_return = "included_in_denominator"
zero_pret = "ID_zero"
zero_volume = "invalid_price_observation"
winner_fraction = 0.2
winner_count_rounding = "floor"
winner_tie_break = "symbol_ascending"
winner_absolute_pret_filter = "none_relative_top_quintile"
winner_pool = "same_finite_ID_PRET_history_liquidity_historical_name_eligible_pool"
primary = "lowest_ID_top50_symbol_ascending_ties"
paired_baseline = "highest_PRET_top50_symbol_ascending_ties_in_identical_winner_pool"
signal_frequency = "completed_month_end"
parameter_grid = "one_fixed_252_21_20percent_configuration"
source = "https://academicweb.nd.edu/~zda/Frog.pdf"
adaptation = "Original 12-calendar-month formation skip one month and six-month holding becomes 252-session formation skip 21 sessions and monthly rebalance; conditional relative winners only, no unconditional low-ID claim."

[execution]
auto_trade = false
