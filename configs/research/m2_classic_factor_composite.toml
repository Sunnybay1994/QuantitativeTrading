[research]
hypothesis_id = "m2-classic-std-roc-rsv-equal-rank-vol-target-v1"
hypothesis = "Equal-weight cross-sectional ranks of validation-directed STD20, ROC20 and RSV20, combined with the frozen unlevered 60-observation 12% volatility target, produce positive absolute returns after 2x A-share cost stress."
strategy_name = "classic_factor_composite_top50"
strategy_version = "v1"
random_seed = 20260815

[data]
snapshot_id = "b79a7b5e66dee0ae439c030078414157ca6c1f3b6ce7fbe5e36ff3910c1089d2"
warmup_start = 2019-01-01
research_start = 2020-01-01
research_end = 2026-08-13

[universe]
freeze_start = 2019-01-01
freeze_end = 2019-12-31
top_n = 800
minimum_observations = 120
minimum_average_amount = 20000000.0

[factors]
names = ["alpha158_std20", "alpha158_roc20", "alpha158_rsv20"]
horizons = [1, 5, 20]
minimum_history_rows = 120
minimum_daily_symbols = 100
groups = 5

[composite]
name = "alpha158_std_roc_rsv_equal_rank"
method = "validation_directed_equal_weight_cross_sectional_average_rank"

[risk_control]
method = "unlevered_portfolio_volatility_target"
lookback_observations = 60
annualized_volatility = 0.12
annualization_sessions = 252

[portfolio]
selection_horizon_sessions = 20
rebalance_every_sessions = 20
top_k = 50
initial_cash = 1000000.0
cost_multipliers = [0.5, 1.0, 2.0]
cost_config_relative_path = "configs/research/m3_qlib_example.toml"

[admission]
minimum_mean_test_rank_ic = 0.01
minimum_positive_test_folds = 2
require_direction_consistency = true
require_positive_2x_cost_return = true

[[walk_forward.folds]]
train_start = 2020-01-01
train_end = 2020-12-31
validation_start = 2021-01-01
validation_end = 2021-12-31
test_start = 2022-01-01
test_end = 2022-12-31

