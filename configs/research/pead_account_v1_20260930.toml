id = "pead40_personal_v1"
registered_on = 2026-09-30
auto_trade = false
cases = ["pead40", "all_events"]
cost_multipliers = [0.5, 1.0, 2.0]
hypothesis = "Positive earnings surprise above the previous-quarter P90, held for 40 sessions after first publication, improves the cost-after personal account over otherwise identical unscreened eligible financial events."
scope = "One fixed historical development experiment. Reconstructed financial/name vintages are not original releases, and previously observed history is not new out-of-sample evidence. No admission or forward account changes."

[inputs]
event_root = "artifacts/research/pead_event_inputs_20260930_01"
execution_snapshot = "factor_battery_20260911_v2"
limits_snapshot = "limits_20260911"
return_benchmark_config = "configs/data/return_benchmarks_q1b_20260912.toml"
model_rules = "configs/models/q1d_causal48_return_benchmark_20260912.toml"
stress_config = "configs/research/q5_eight_stress_windows_20260912.toml"
start = 2010-01-01
end = 2026-08-31

[paper]
initial_cash = 100000.0
auto_trade = false

[portfolio]
slots = 5
cash_buffer = 0.02
holding_sessions = 40
max_participation = 0.05
stock_dividend_withholding = 0.20
quantity = "Fix new shares using the actual previous-close equity and price, equal 19.6 percent NAV per free slot, with board-specific lots; no execution-open information in intended shares."
capacity = "Use actual previous-close occupied slots including pending conversions; an intended next-open exit still occupies its slot. Reserve at most the free slots from the fixed ranking. No replacement after rejected, unaffordable or unfilled entries."
repeat_symbol = "Ignore a new event for an already held security or pending successor; do not add shares or restart its clock. Coalesced conversion lots inherit the earliest expiry and retain event lineage."
exits = "Attempt full exit at the original reference expiry open; retry each following session while blocked. Keep late entries and ending inventory even when expiry is beyond the data cutoff."

[execution]
priority_salt = "pead40-personal-v1"
priority = "For both cases SHA256(salt|symbol|announcement_date|end_date), ascending. Never rank by future return, security price, or SUE among the qualified pool. No additional seeds."
fill_order = "Hash selects nominations only. The unchanged shared account engine executes sells before buys and symbols ascending within each side."
duplicate = "Same symbol and first execution date: retain latest known announcement, then newest financial period."
candidate_pead = "Frozen selected=true, with unchanged prior-quarter minimum sample and positive-SUE P90 rule."
candidate_control = "Frozen financial VALID and market eligible and finite prior-quarter threshold; no positive-SUE or percentile requirement."
entry = "One attempt on the first exchange session strictly after announcement date; no delayed entry or later replacement."
participation = "Each side capped at 5 percent of the exact 20 exchange-session mean amount ending at the previous close; unknown windows cannot be treated as zero cost or unlimited capacity."
missing = "No valid OHLCV bar or no verified daily price band means no fill. Preserve and retry blocked exits. Record independently whether suspension requests cover the date; absent request is not proof of no halt."
suspension_policy = "bar_present_known_suspensions_block"
suspension_limitation = "A positive-volume bar on a date without a complete suspension request is only a historical execution assumption. Mark actual orders/fills with coverage. Any promising account requires original-source validation on actual execution dates before promotion; do not describe this run as verified executable or independently out of sample. Do not choose between missing-data policies by observed returns."
delisting = "Do not silently zero a held unclassified corporate event. Resolve its actual consideration before continuing; never remove an event from the candidate pool using future delisting."
alias = "001914 before 2019-12-16 may use same-entity 000043 price bands only after source-backed code-change evidence and same-date close/amount equality. Keep an explicit mapping receipt."

[costs.a_share]
commission_rate = 0.00025
commission_min = 1.0
stamp_tax_sell = 0.0005
transfer_fee = 0.00001
slippage = 0.001
effective_from = 2010-01-01
historical_statutory_fees = true
pre_2015_sh_transfer_multiplier = 2.0
pre_2015_sh_transfer_min = 1.0
pre_2015_sh_par_value = 1.0

[costs.etf]
commission_rate = 0.00025
commission_min = 1.0
slippage = 0.001
effective_from = 2010-01-01

[[share_exchanges]]
