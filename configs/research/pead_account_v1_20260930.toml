[evaluation]
primary = "Full continuous historical path, actual holding window with subsequent cash retained; 1x and 2x paired CAGR and rf2 Sharpe versus all_events. Also report exposure differences: the comparator does not isolate a pure causal earnings effect."
benchmarks = "Use only real matched daily return-index coverage; 510300 has its first price on 2012-05-28 and its first measurable daily return on 2012-05-29. Earlier ETF comparison is unavailable. Keep full account path. Equal-weight delisting consideration still requires review; mark related admission evidence pending."
required = ["annual and monthly returns", "rf0 and rf2 Sharpe", "drawdown", "turnover", "cash and name concentration", "all intended orders and rejections", "continuous stress windows with cash-only N/A", "three costs", "paired common-window result", "terminal holdings and delayed exits"]
rules = "Original model admission thresholds remain unchanged. Neither an input repair nor a historical paired gain is PAPER_CANDIDATE. No <=3-year Top-K judgement."
stop = "If this fixed account fails to improve both net CAGR and rf2 Sharpe versus the control at 1x, or its apparent advantage reverses at 2x, stop this portfolio hypothesis without changing SUE sign, percentile, holding window, number of slots or hash seed. Diagnose saved paths before any distinct future mechanism."
limitations = ["reconstructed financial and name vintages", "daily OHLC fills are not order-book execution proof", "minimum commission 1 CNY is the user's assumption", "unknown intraday suspension coverage must be reported", "no independent future outcome yet"]
