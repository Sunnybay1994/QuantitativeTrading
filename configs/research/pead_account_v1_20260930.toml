to_symbol = "600332.SH"
announcement_date = 2013-04-26
record_date = 2013-04-26
effective_date = 2013-04-26
tradable_date = 2013-05-23
ratio = "0.95"
fractional_allocation = "floor"
record_capture = "opening_holdings_same_day_suspended"
valuation_until_tradable = "predecessor_book_value"
account_registration_assumption = "normal_account_confirmed_initial_registration"
cash_option = "not_exercised"
source = "https://static.cninfo.com.cn/finalpage/2013-04-26/62429428.PDF"
