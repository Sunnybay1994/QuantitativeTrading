[research]
hypothesis_id = "b34-gold-vwap-reversion-design-screen-20260909"
hypothesis = "At 10:30, a gold ETF price at least one morning price standard deviation below cumulative VWAP predicts a profitable same-day rebound beyond three times round-trip cost."
symbols = ["518880.SH", "159934.SZ"]
design_start = 2026-01-01
design_end = 2026-03-31
source = "baostock"
frequency = "5m"
# Local implementation of the agenda's industry VWAP-reversion hypothesis.
# Design period has appeared in earlier studies; maximum conclusion RESEARCH_ONLY.

[signal]
decision_time = "10:30"
morning_bars = 12
vwap = "sum(amount)/sum(volume), completed 09:30-10:30 bars only"
dispersion = "sample standard deviation of the 12 completed bar closes, ddof=1"
z = "(10:30 known close - cumulative VWAP)/dispersion"
maximum_z = -1.0
zero_dispersion = "no_signal"
entry = "10:35_bar_open"
exit = "14:55_bar_open"
direction = "long_only"
required_bars = 48
maximum_round_trips_per_day = 1
baseline = "every_complete_session_same_entry_exit_without_z_filter"

[costs]
order_budget = 100000.0
board_lot = 100
tick_size = 0.001
commission_rate = 0.00025
commission_min = 5.0
slippage_ticks_per_side = 1.0
spread_ticks_assumption = 1.0
cost_multipliers = [0.5, 1.0, 2.0]

[screen]
minimum_gross_to_cost = 3.0
minimum_signals = 20
apply_per_symbol = true
conclusion_if_failed = "REJECTED"
conclusion_if_passed = "RESEARCH_ONLY"

[next_stage]
requires_design_pass = true
requires_separate_preregistration = true
validation_start = 2026-04-01
validation_end = 2026-06-30
test_start = 2026-07-01
test_end = 2026-09-08
required_delay_minutes = [0, 1, 3]

[execution]
auto_trade = false
