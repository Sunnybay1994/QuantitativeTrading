[research]
hypothesis_id = "b59-annual-debt-ebitda-monthly-top50-20260910"
hypothesis = "Lower annual provider-reported interest-bearing debt / positive EBITDA predicts next-open 20-session returns and may qualify a monthly Top50 portfolio. Latest known industrial income period anchors the indicator record; no parameter search."
strategy_name = "b59_annual_debt_ebitda_top50"
strategy_version = "v1"
random_seed = 20260910

[data]
refresh_config = "configs/data/refresh.toml"
warmup_start = 2023-01-01
research_start = 2023-07-01
research_end = 2026-09-08

[universe]
name = "liquid_top800_2019"
freeze_start = 2019-01-01
freeze_end = 2019-12-31
top_n = 800
minimum_observations = 120
minimum_average_amount = 20000000.0

[factors]
names = ["pit_annual_debt_ebitda"]
directions = [-1]
minimum_history_rows = 120
minimum_daily_symbols = 100

[composite]
method = "equal_weight_zscore_monthly"
standard_deviation_ddof = 0
zero_variance_component = "zero"
missing_component = "exclude_symbol"
winsorization = "none"

[portfolio]
top_k = 50
initial_cash = 1000000.0
cost_multipliers = [0.5, 1.0, 2.0]
rebalance = "month_end_close_next_session_open"
benchmark = "510300.SH"
benchmark_rebalance = "buy_and_hold"
stock_dividend_withholding = 0.20
# Unsold holdings are written down fully on the first session after delisting.
# Added during execution-data debugging, before any fold results were produced.
delisted_holding_recovery = 0.0
initial_signal = "previous_session_close"

[costs.a_share]
commission_rate = 0.00025
commission_min = 5.0
stamp_tax_sell = 0.0005
transfer_fee = 0.00001
slippage = 0.001
effective_from = 2023-08-28

[costs.etf]
commission_rate = 0.00025
commission_min = 5.0
slippage = 0.001
effective_from = 2023-01-01

[admission]
minimum_mean_test_rank_ic = 0.03
minimum_positive_test_folds = 2
maximum_absolute_rank_correlation = 0.8
redundancy_references = ["alpha158_std20", "alpha158_roc20", "alpha158_rsv20"]
maximum_conclusion = "PAPER_CANDIDATE"
minimum_annual_excess_1x = 0.03
maximum_annual_one_way_turnover = 6.0
maximum_drawdown_ratio_to_benchmark = 1.5
# Historical factor replication: no new prospective sample is claimed.
# RESEARCH_ONLY requires IC and redundancy conditions; PAPER additionally requires all portfolio rules.
# All three cost scenarios and the 510300 comparison are reported even after rejection.

[eligibility]
historical_exchange_name = true
exclude_st_or_delisting_name = true
unknown_historical_name = "exclude"

[financials]
snapshot_id = "b7_halfyear_20260909"
factor_family = "debt_ebitda"
history_start = 2017-01-01
allowed_report_types = ["1"]
company_type = "1"
signal_frequency = "completed_month_end"
availability = "strictly_before_signal_date"
missing_quarter = "null"
# Monthly sparse RankIC observations, horizon 20 sessions; no daily forward-fill.
# Fixed annual debt/EBITDA ratio, negative direction; no parameter grid.
# Type 1 is consolidated cumulative; conflicting revisions and invalid denominators are excluded.

[[walk_forward.folds]]
train_start = 2023-07-01
train_end = 2023-09-30
validation_start = 2023-10-01
validation_end = 2023-12-31
test_start = 2024-01-01
test_end = 2024-12-31

[[walk_forward.folds]]
train_start = 2023-07-01
train_end = 2023-12-31
validation_start = 2024-01-01
validation_end = 2024-12-31
test_start = 2025-01-01
test_end = 2025-12-31

[[walk_forward.folds]]
train_start = 2023-07-01
train_end = 2024-12-31
validation_start = 2025-01-01
validation_end = 2025-12-31
test_start = 2026-01-01
test_end = 2026-09-08

[debt_ebitda]
formula = "interestdebt / ebitda"
source_table = "fina_indicator"
maximum_age_months = 18
latest_annual_period = "latest_known_industrial_income_period_no_fallback"
income_usage = "period_and_company_type_only"
missing_component = "exclude_symbol"
valid_values = "finite_nonnegative_debt_positive_ebitda"
source = "https://tushare.pro/document/2?doc_id=79"
# Annual December 31 periods only; numerator and denominator from the same indicator record.
# Latest known type-1 industrial annual income period anchors selection; income numbers are not used.
# Both indicator and anchor announcements must precede the signal; missing or conflicting latest indicator stays null.
# Zero debt is valid; zero/negative/missing EBITDA is excluded, never ranked as low leverage.
# Use the provider debt aggregate, without filling missing liability line items with zero.
# Historical safety-ratio replication in previously inspected periods, not a prospective result.