[research]
hypothesis_id = "b55-quarterly-roe-stability-monthly-top50-20260910"
hypothesis = "Lower standard deviation of quarterly parent ROE over the last 60 calendar quarters with at least 12 valid observations predicts next-open 20-session returns. Fixed local QMJ earnings-stability adaptation."
strategy_name = "b55_quarterly_roe_stability_top50"
strategy_version = "v1"
random_seed = 20260910

[data]
refresh_config = "configs/data/refresh.toml"
warmup_start = 2023-01-01
research_start = 2023-07-01
research_end = 2026-09-08

[universe]
name = "liquid_top800_2019"
freeze_start = 2019-01-01
freeze_end = 2019-12-31
top_n = 800
minimum_observations = 120
minimum_average_amount = 20000000.0

[factors]
names = ["pit_quarterly_roe_volatility"]
directions = [-1]
minimum_history_rows = 120
minimum_daily_symbols = 100

[composite]
method = "equal_weight_zscore_monthly"
standard_deviation_ddof = 0
zero_variance_component = "zero"
missing_component = "exclude_symbol"
winsorization = "none"

[portfolio]
top_k = 50
initial_cash = 1000000.0
cost_multipliers = [0.5, 1.0, 2.0]
rebalance = "month_end_close_next_session_open"
benchmark = "510300.SH"
benchmark_rebalance = "buy_and_hold"
stock_dividend_withholding = 0.20
# Unsold holdings are written down fully on the first session after delisting.
# Added during execution-data debugging, before any fold results were produced.
delisted_holding_recovery = 0.0
initial_signal = "previous_session_close"

[costs.a_share]
commission_rate = 0.00025
commission_min = 5.0
stamp_tax_sell = 0.0005
transfer_fee = 0.00001
slippage = 0.001
effective_from = 2023-08-28

[costs.etf]
commission_rate = 0.00025
commission_min = 5.0
slippage = 0.001
effective_from = 2023-01-01

[admission]
minimum_mean_test_rank_ic = 0.03
minimum_positive_test_folds = 2
maximum_absolute_rank_correlation = 0.8
redundancy_references = ["alpha158_std20", "alpha158_roc20", "alpha158_rsv20"]
maximum_conclusion = "RESEARCH_ONLY"
# Historical factor replication: no new prospective sample is claimed.
# A single factor enters the composition pool only if both IC and redundancy conditions pass.
# All three cost scenarios and the 510300 comparison are reported even after rejection.

[eligibility]
historical_exchange_name = true
exclude_st_or_delisting_name = true
unknown_historical_name = "exclude"

[financials]
snapshot_id = "b7_halfyear_20260909"
factor_family = "quarterly_roe_stability"
history_start = 2008-01-01
allowed_report_types = ["1"]
company_type = "1"
signal_frequency = "completed_month_end"
availability = "strictly_before_signal_date"
missing_quarter = "null"
# Monthly sparse RankIC observations, horizon 20 sessions; no daily forward-fill.
# One fixed quarterly ROE dispersion formula and negative direction; no parameter grid.
# Type 1 is consolidated cumulative; conflicting revisions and invalid denominators are excluded.

[[walk_forward.folds]]
train_start = 2023-07-01
train_end = 2023-09-30
validation_start = 2023-10-01
validation_end = 2023-12-31
test_start = 2024-01-01
test_end = 2024-12-31

[[walk_forward.folds]]
train_start = 2023-07-01
train_end = 2023-12-31
validation_start = 2024-01-01
validation_end = 2024-12-31
test_start = 2025-01-01
test_end = 2025-12-31

[[walk_forward.folds]]
train_start = 2023-07-01
train_end = 2024-12-31
validation_start = 2025-01-01
validation_end = 2025-12-31
test_start = 2026-01-01
test_end = 2026-09-08

[quarterly_roe_stability]
formula = "std(single_quarter_parent_income / same_period_parent_equity)"
window_quarters = 60
minimum_valid_quarters = 12
standard_deviation_ddof = 1
maximum_age_months = 6
window_anchor = "latest_known_income_period"
missing_quarter = "omit_within_fixed_calendar_window"
flow_predecessor = "latest_revision_known_by_successor_publication"
source = "https://link.springer.com/article/10.1007/s11142-018-9470-2"
# Calendar window does not extend backwards to replace missing quarters.
# Parent net profit and period-end parent equity are the fixed local ROE mapping.
# Require finite quarterly income and strictly positive finite equity; missing is not zero.
# Latest known period anchors the window even if its own income is missing or conflicted.
# At least 12 observations; no annual fallback and no grid of window/minimum/freshness values.
