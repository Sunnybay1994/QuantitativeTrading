family = "liquidity_comovement_logchange_60m_v1"
status = "registered_before_signal_computation_not_admitted"
source = "https://pages.stern.nyu.edu/~lpederse/papers/liquidity_risk.pdf"
source_sections = "Acharya and Pedersen (2005), three liquidity-risk covariance channels; sections 3 and 4"
kernel = "src/quant/factors/liquidity_comovement.py"
signals = ["liquidity_commonality_60m", "return_market_illiquidity_60m", "illiquidity_market_return_60m"]
directions = [1, -1, -1]
formation_months = 60
minimum_joint_months = 48
minimum_market_members = 100
minimum_market_coverage = 0.90
monthly_illiquidity = "amihud_illiquidity_monthly_calendar80_v1; mean abs(adjusted daily return)/(amount CNY/1e6), at least max(10,ceil(0.8*exchange sessions)) valid days"
liquidity_change = "dL_i,t = log(ILLIQ_i,t) - log(ILLIQ_i,t-1); exact consecutive calendar months, strictly positive finite inputs"
market_formation = "Every Shanghai/Shenzhen stock with a valid prior-month ILLIQ; no current survivor or future-eligible-stock filter"
market_measure = "Equal-weight joint available dL and exact adjusted month-end return in the frozen prior-month cohort; disclose valid/reference counts, require at least 100 and 90 percent coverage. Remove the target stock from both sums and counts, then recheck thresholds"
market_interpretation = "Observed prior-active-stock liquidity/return proxy, not full-market execution costs, audited wealth benchmark or intraday sentiment index"
signal_formulas = ["cov(dL_i,dL_market_ex_i)/var(dL_market_ex_i)", "cov(r_i,dL_market_ex_i)/var(dL_market_ex_i)", "cov(dL_i,r_market_ex_i)/var(r_market_ex_i)"]
sample_policy = "All three slopes and matched controls use the identical finite joint sample in the last 60 calendar months, at least 48; require a full 60-calendar-month span and valid current observation. Never compress missing months, carry stale observations or replace gaps by zero"
publication = "Completed exchange month-end close only, effective next exchange session; caller provides full exchange calendar including the following session"
adaptation = "Mechanism-inspired A-share proxies, not a replication of the liquidity-adjusted CAPM. Log differences replace calibrated transaction-cost levels and full-sample AR innovations; each slope has its own denominator. Do not sum them as a net beta or import US spread-calibration constants"
interpretation = "Unpriced-exposure hypothesis, not evidence of alpha; expected signs are fixed from the economic channels and remain hypotheses after this proxy adaptation"
matched_controls = ["liquidity_log_level_60m", "liquidity_logchange_vol_60m", "liquidity_return_vol_60m", "liquidity_market_beta_60m"]
fixed_control_ids = ["log_total_market_value", "amihud_illiquidity_monthly_calendar80_v1", "free_float_turnover_level_monthly_calendar80_v1", "reversal_20", "report01_skip_month_momentum_n252", "market_beta_60_vs_510300", "ivol_ff3_60"]
incremental_policy = "All existing admitted variants plus fixed and matched controls; original raw/size-industry-neutral battery, unchanged full-family multiple testing, 96-month and N4 incremental requirements"
minimum_formal_months = 96
incremental_minimum_nw_t = 2.5
stop_rule = "Insufficient common input history remains untested; original statistical or incremental failure closes the fixed family, with no sign/window/coverage/Top-K search. Historical stress exposure alone is not timing or portfolio benefit"
account_policy = "Only original admission may justify a separate portfolio registration: at most one CNY100000 few-holdings account, CNY1 minimum commission, original three cost levels and continuous path"
auto_trade = false
