[meta]
config_version = "1.0.0"
purpose = "M3 Alpha158 + LightGBM reproducible baseline"
# Python 3.13 base 尚无可安装的 pyqlib 发行包；兼容性门禁通过前不得改为 true。
enabled = false

[data]
universe = "CSI300_TUSHARE_MONTHLY_OBSERVED_PIT_V1"
benchmark = "H00300.CSI"
# M3 快照只允许一个显式数据源；readiness/staging/manifest/provider 必须使用同一值。
source = "tushare"
# 两端是首版 signal session 边界，须由 G1 verified SH calendar 证明为开市日；
# loader 只做静态类型/跨字段校验，不硬编码交易日表，也不自动把闭市日滚到附近 session。
# 费用首段 costs.a_share_periods[0].effective_from=2016-01-01 是自然日生效区间，不随 signal start 改动。
start_date = 2016-01-04
# 信号域截止 2026-06-26（SH session）；另抓 10 个尾随交易日，使 h=10 标签截至 2026-07-10 可完整计算。
end_date = 2026-06-26
market = "CN"
frequency = "day"
minimum_train_sessions = 756
minimum_cross_section_symbols = 100
required_fields = ["open", "high", "low", "close", "volume", "amount", "adj_factor"]
provider_fields = ["open", "high", "low", "close", "vwap", "volume", "factor"]
provider_format = "qlib_bin"
snapshot_hash = "sha256"

[runtime.qlib]
version = "0.9.7"
supported_python = ">=3.8,<3.13"
dump_script_url = "https://raw.githubusercontent.com/microsoft/qlib/v0.9.7/scripts/dump_bin.py"
dump_script_sha256 = "b8f34c57ce1ef4b1772f3909735e66058f21b25bd7ab8a5f16318822401fe53f"
dump_script_bytes = 21847

[features]
handler = "Alpha158"
feature_version = "alpha158_v1"
expected_feature_count = 158
minimum_scorable_coverage = 0.98
processor_policy = "none_raw_features"
missing_value_policy = "inf_to_nan_lightgbm_native"
authoritative_label_source = "quant_forward_return_label"

[labels]
horizons_sessions = [5, 10]
entry_offset_sessions = 1
entry_field = "open"
exit_field = "close"
relative_to_benchmark = true
label_version = "theoretical_next_open_to_h_close_total_return_excess_v2"

[g1_backfill]
index_weight_code = "000300.SH"
benchmark_code = "H00300.CSI"
membership_method_version = "tushare_monthly_observed_next_session_close_v1"
session_market = "SH"
expected_constituent_count = 300
membership_warmup_months = 1
feature_warmup_sessions = 60
label_tail_sessions = 10
request_rate_per_minute = 60
max_attempts = 5
retry_base_seconds = 2.0

[g1_backfill.endpoint_row_limits]
daily = 6000
adj_factor = 6000
index_daily = 5000
index_weight = 5000
suspend_d = 5000
stk_limit = 5800
# Tushare 文档未承诺 dividend 单次上限；这是项目 fail-closed 安全阈值。
dividend = 5000

[g1_backfill.reconciliation]
reference_source = "baostock"
sample_symbols = 30
dates_per_symbol = 20
price_atol = 0.01
price_rtol = 0.0001
volume_rtol = 0.001
max_mismatch_rate = 0.01

[g1_backfill.corporate_action_reconciliation]
factor_ratio_rtol = 0.001

[walk_forward]
train_sessions = 756
validation_sessions = 126
test_sessions = 126
step_sessions = 126
embargo_sessions = 10
selection_metric = "validation_l2"
test_overlap_policy = "ERROR"

[model.lightgbm]
model_version = "alpha158_lgb_v1"
objective = "regression"
metric = "l2"
device_type = "cpu"
learning_rate = 0.05
num_leaves = 31
max_depth = -1
feature_fraction = 0.9
bagging_fraction = 0.9
bagging_freq = 1
num_boost_round = 500
early_stopping_rounds = 50
early_stopping_min_delta = 0.0
seed = 20260712
data_random_seed = 20260712
feature_fraction_seed = 20260712
bagging_seed = 20260712
deterministic = true
force_col_wise = true
num_threads = 4

[portfolio]
strategy = "topk"
strategy_version = "m3_topk_v1"
top_k = 30
cash_buffer = 0.05
max_weight = 0.05
rebalance = "daily_signal_next_session_open"

[backtest.a_share]
initial_cash = 1000000.0
price_tick = 0.01
target_omission_means_zero = true
cash_entitlement_fallback = "ERROR"
stock_entitlement_fallback = "ERROR"
unexplained_factor_change = "ERROR"
partial_suspension_open_policy = "REQUIRE_EXPLICIT_OPEN_TRADABLE"
dividend_tax_policy = "GROSS_IGNORE_PERSONAL_HOLDING_PERIOD_TAX"
rights_policy = "ERROR_IF_RELEVANT"
force_liquidation = false
friction_multipliers = [0.5, 1.0, 2.0]

[evaluation]
minimum_ic_symbols = 30

[validation.provider]
sample_symbols = 3
sample_dates_per_symbol = 20
gap_dates_per_symbol = 5
sampling_policy_version = "provider_market_stratified_hash_first_last_v1"

[validation.labels]
reconciliation_version = "qlib_raw_plus_independent_benchmark_v1"
qlib_expression_atol = 1e-7
benchmark_return_atol = 1e-12
label_return_atol = 5e-6

[costs]
# 压力倍数只作用于佣金、最低佣金和滑点；印花税与过户费保持对应历史期值。
schedule_version = "a_share_research_cost_schedule_v1"
stamp_tax_source = "https://www.mof.gov.cn/jrttts/202308/t20230828_3904235.htm"
transfer_fee_source = "https://www.xinhuanet.com/2022-04/28/c_1128605983.htm"
scaled_components = ["commission_rate", "commission_min", "slippage"]

[[costs.a_share_periods]]
effective_from = 2016-01-01
effective_to = 2022-04-28
commission_rate = 0.00025
commission_min = 5.0
stamp_tax_sell = 0.001
transfer_fee = 0.00002
slippage = 0.001

[[costs.a_share_periods]]
effective_from = 2022-04-29
effective_to = 2023-08-27
commission_rate = 0.00025
commission_min = 5.0
stamp_tax_sell = 0.001
transfer_fee = 0.00001
slippage = 0.001

[[costs.a_share_periods]]
effective_from = 2023-08-28
commission_rate = 0.00025
commission_min = 5.0
stamp_tax_sell = 0.0005
transfer_fee = 0.00001
slippage = 0.001

[tracking]
experiment_name = "m3_alpha158_lightgbm"
tracking_uri = "sqlite:///artifacts/research/m3/mlflow.db"
artifact_root = "artifacts/research/m3"
log_model = true
log_predictions = true
log_dataset_manifest = true

[acceptance]
reproducibility_score_atol = 1e-12
reproducibility_metric_atol = 1e-12
required_metrics = [
    "evaluation.test_rank_ic",
    "evaluation.test_rank_icir",
    "backtest.1p0x.test_net_excess_return",
    "backtest.1p0x.test_turnover",
    "backtest.1p0x.test_max_drawdown",
]
minimum_feature_coverage = 0.98
minimum_prediction_coverage = 1.0
minimum_label_coverage = 0.98
minimum_evaluation_coverage = 0.98
minimum_computable_ic_date_ratio = 0.95
