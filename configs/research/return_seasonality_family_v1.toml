signals = ["return_seasonality_ann_y2_5", "return_seasonality_nann_y2_5", "return_seasonality_amn_y2_5"]
directions = [1, -1, 1]
target_month = "next calendar month after completed signal month"
all_lags_from_target = "integers 13 through 60, inclusive"
