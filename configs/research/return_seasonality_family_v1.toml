publication = "signal month-end close, effective next exchange session; monthly score applies to next calendar month"
adaptation = "fixed years 2-5 formation from original tables; common complete 48-month cohort and local adjusted-price basis; not a replication of the 20-year US factor portfolio or China paper profits"
control_columns_only = ["return_mean_all_y2_5", "return_compounded_y2_5"]
