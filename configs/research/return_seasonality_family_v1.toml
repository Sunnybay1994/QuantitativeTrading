statistical_pipeline = "existing original factor battery only; raw and size/industry neutral, unchanged 96-month and multiple-testing screens"
incremental_policy = "existing admitted controls plus both saved long-term controls and registered short reversal, momentum and liquidity controls; treat ANN/NANN/AMN as one related family, not three independent mechanisms"
stop_rule = "insufficient coverage leaves unknown; statistical or incremental failure closes this fixed family without window/sign/Top-K rescue"
