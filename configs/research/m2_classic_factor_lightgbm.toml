[research]
hypothesis_id = "m2-classic-five-factor-lightgbm-510300-v1"
hypothesis = "A train-only LightGBM using daily cross-sectional ranks of STD20, ROC20, RSV20, CORR20 and WVMA20 improves out-of-sample 20-session ranking and remains profitable under the frozen 510300 volatility control and 2x costs."
strategy_name = "classic_five_factor_lightgbm_510300_top50"
strategy_version = "v1"
random_seed = 20260815

[data]
snapshot_id = "b79a7b5e66dee0ae439c030078414157ca6c1f3b6ce7fbe5e36ff3910c1089d2"
warmup_start = 2019-01-01
research_start = 2020-01-01
research_end = 2026-08-13

[universe]
freeze_start = 2019-01-01
freeze_end = 2019-12-31
top_n = 800
minimum_observations = 120
minimum_average_amount = 20000000.0

[features]
names = [
  "alpha158_std20",
  "alpha158_roc20",
  "alpha158_rsv20",
  "alpha158_corr20",
  "alpha158_wvma20",
]
excluded_redundant_names = ["alpha158_ma20"]
transform = "daily_cross_sectional_average_rank_centered"
label_horizon_sessions = 20
minimum_history_rows = 120
minimum_daily_symbols = 100
groups = 5

[model.lightgbm]
model_version = "m2_classic_five_factor_lgb_v1"
objective = "regression"
metric = "l2"
device_type = "cpu"
learning_rate = 0.05
num_leaves = 31
max_depth = -1
feature_fraction = 0.9
bagging_fraction = 0.9
bagging_freq = 1
num_boost_round = 500
early_stopping_rounds = 50
seed = 20260815
deterministic = true
force_col_wise = true
num_threads = 4

[risk_control]
method = "unlevered_benchmark_volatility_target"
benchmark = "510300.SH"
lookback_observations = 60
annualized_volatility = 0.12
annualization_sessions = 252
require_zero_cash_period_fraction = true

[portfolio]
selection_horizon_sessions = 20
rebalance_every_sessions = 20
top_k = 50
initial_cash = 1000000.0
cost_multipliers = [0.5, 1.0, 2.0]
cost_config_relative_path = "configs/research/m3_qlib_example.toml"

[admission]
minimum_mean_test_rank_ic = 0.01
minimum_positive_test_folds = 2
require_direction_consistency = true
require_positive_2x_cost_return = true

[[walk_forward.folds]]
train_start = 2020-01-01
train_end = 2020-12-31
validation_start = 2021-01-01
validation_end = 2021-12-31
test_start = 2022-01-01
test_end = 2022-12-31

[[walk_forward.folds]]
train_start = 2020-01-01
train_end = 2022-12-31
validation_start = 2023-01-01
validation_end = 2023-12-31
test_start = 2024-01-01
test_end = 2024-12-31

[[walk_forward.folds]]
train_start = 2020-01-01
train_end = 2024-12-31
validation_start = 2025-01-01
validation_end = 2025-12-31
test_start = 2026-01-01
test_end = 2026-08-13
