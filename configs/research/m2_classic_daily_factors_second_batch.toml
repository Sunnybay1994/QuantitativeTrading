[research]
hypothesis_id = "m2-classic-second-batch-ma-corr-wvma-v1"
hypothesis = "MA20, price-volume CORR20 and volume-weighted absolute-return variability WVMA20 provide non-redundant cross-sectional information under the frozen next-open walk-forward and A-share cost protocol."
strategy_name = "classic_second_batch_top50"
strategy_version = "v1"
random_seed = 20260815

[data]
snapshot_id = "b79a7b5e66dee0ae439c030078414157ca6c1f3b6ce7fbe5e36ff3910c1089d2"
