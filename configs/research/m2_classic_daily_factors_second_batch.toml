freeze_end = 2019-12-31
top_n = 800
minimum_observations = 120
minimum_average_amount = 20000000.0

[factors]
catalog = "alpha158_second_batch_v1"
names = ["alpha158_ma20", "alpha158_corr20", "alpha158_wvma20"]
redundancy_reference_names = [
  "alpha101_033",
  "alpha101_101",
  "alpha158_roc20",
  "alpha158_std20",
  "alpha158_rsv20",
  "alpha158_vma20",
]
