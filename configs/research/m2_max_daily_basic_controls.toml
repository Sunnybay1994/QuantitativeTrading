[research]
hypothesis_id = "m2-max-daily-basic-size-turnover-control-v1"
hypothesis = "The negative next-open return relation of twenty-session MAX remains economically useful after a same-close cross-sectional rank control for total market value and free-float turnover."
strategy_name = "max_size_turnover_residual_low_top50"
strategy_version = "v1"
random_seed = 20260816

[data]
bar_snapshot_id = "b79a7b5e66dee0ae439c030078414157ca6c1f3b6ce7fbe5e36ff3910c1089d2"
warmup_start = 2019-01-01
research_start = 2020-01-01
research_end = 2026-08-13

[universe]
freeze_start = 2019-01-01
freeze_end = 2019-12-31
top_n = 800
minimum_observations = 120
minimum_average_amount = 20000000.0

[factors]
catalog = "max_daily_basic_size_turnover_control_v1"
names = ["max_daily_return_20_size_turnover_residual"]
redundancy_reference_names = [
  "max_daily_return_20",
  "log_total_market_value",
  "turnover_rate_free",
]
horizons = [1, 5, 20]
minimum_history_rows = 120
minimum_daily_symbols = 100
groups = 5

[max_control]
raw_max_run_id = "10dea14f1fcbbbeb78871cddb7b00cd06d77cf005c3a776c4713f5a4f4129bb3"
daily_basic_snapshot_id = "e97c0e9c82c445bbc9b389e8e8504f61b0b67d2f789208f75625526c38b4c03c"
raw_factor = "max_daily_return_20"
controls = ["log_total_market_value", "turnover_rate_free"]
rank_method = "average"
regression = "cross_sectional_rank_ols_with_intercept"
singularity_rule = "positive_smallest_eigenvalue"
minimum_regression_rows = 100
maximum_condition_number = 1000000.0
normal_equation_orthogonality_tolerance = 1e-10
expected_direction = -1
trial_budget = 1

[coverage]
minimum_rebalance_symbols = 100
minimum_median_coverage = 0.80

[portfolio]
selection_horizon_sessions = 20
rebalance_every_sessions = 20
top_k = 50
initial_cash = 1000000.0
cost_multipliers = [0.5, 1.0, 2.0]
cost_config_relative_path = "configs/research/m3_qlib_example.toml"

[admission]
minimum_mean_test_rank_ic = 0.01
minimum_positive_test_folds = 2
require_direction_consistency = true
require_positive_2x_cost_return = true

