[research]
hypothesis_id = "b9-gold-orb30-design-screen-20260909"
hypothesis = "A fixed long-only 30-minute opening-range breakout has mean gross profit at least three times estimated round-trip cost in the design sample."
symbols = ["518880.SH", "159934.SZ"]
design_start = 2026-01-01
design_end = 2026-03-31
source = "baostock"
frequency = "5m"

[signal]
opening_range_end = "10:00"
last_signal_time = "14:30"
comparison = "close_strictly_above_opening_range_high"
entry = "next_bar_open"
exit = "14:55_bar_open"
maximum_round_trips_per_day = 1
minimum_holding_bars = 1
required_bars = 48

[costs]
order_budget = 100000.0
board_lot = 100
tick_size = 0.001
commission_rate = 0.00025
commission_min = 5.0
slippage_ticks_per_side = 1.0
spread_ticks_assumption = 1.0
cost_multipliers = [0.5, 1.0, 2.0]

[screen]
minimum_gross_to_cost = 3.0
minimum_signals = 20
conclusion_if_failed = "REJECTED"
conclusion_if_passed = "RESEARCH_ONLY"
# Design screen only; cost-adjusted per-signal estimates are not account backtests.
# If the optimistic next-bar-open gross edge fails, do not run validation/test or delay tuning.
# The local cost-map tick screen chose the two gold ETFs; no retrospective OOS claim.
