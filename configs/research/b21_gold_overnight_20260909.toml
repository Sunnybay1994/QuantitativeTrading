[research]
hypothesis_id = "b21-gold-overnight-design-screen-20260909"
hypothesis = "Unconditional 14:55-to-next-session-09:35 gold ETF returns exceed three times round-trip cost in the frozen design sample."
symbols = ["518880.SH", "159934.SZ"]
design_start = 2026-01-01
design_end = 2026-03-31
source = "baostock"
frequency = "5m"
# Overnight/intraday decomposition motivation, not an exact replication of the equity paper:
# https://personal.lse.ac.uk/polk/research/TugOfWar.pdf
# Prior daily-close/open cost-map results are known; this is a design screen, not unseen OOS.

[signal]
entry = "14:55_bar_open"
exit = "next_session_09:35_bar_open"
required_bars = 48
maximum_round_trips_per_day = 1
missing_next_session = "exclude_pair_do_not_bridge"

[costs]
order_budget = 100000.0
board_lot = 100
tick_size = 0.001
commission_rate = 0.00025
commission_min = 5.0
slippage_ticks_per_side = 1.0
spread_ticks_assumption = 1.0
cost_multipliers = [0.5, 1.0, 2.0]

[screen]
minimum_gross_to_cost = 3.0
minimum_signals = 20
conclusion_if_failed = "REJECTED"
conclusion_if_passed = "RESEARCH_ONLY"
# Only if this design screen passes, preregister validation/test and 0/1/3 minute delays.
