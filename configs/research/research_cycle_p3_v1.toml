# Concrete retrospective research cycle; existing shared API allowance is exhausted.
# Default execution is an offline plan. No new API allowance is granted by this file.
[diagnosis]
scorecard = "artifacts/factors/scorecard/2026-08-31_20260912_04/factor_scorecard.parquet"
assessments = [
  "artifacts/models/p4_follow_20260911_01/attempt_0017/reports/equal_z/assessment.json",
  "artifacts/models/p4_follow_20260911_01/attempt_0017/reports/positive_mean_ic/assessment.json",
  "artifacts/models/p4_follow_20260911_01/attempt_0017/reports/lightgbm/assessment.json",
]
config = "configs/research/deepseek_diagnosis_v1.toml"

[candidates]
design = "configs/factors/search/p6c_finite_batch01_window02_20260911.toml"
config = "configs/research/deepseek_candidates_v1.toml"
scope = "根据完整评分表与模型诊断提出一批有经济解释的价量或流动性表达式，优先处理量纲、覆盖及旧库冗余问题。每项理由不超过40个汉字，数量可低于上限。沿用冻结设计；历史数据已用于研究，不能宣称独立测试通过。"
fields = ["adj_close", "adj_high", "adj_low", "volume", "amihud_illiquidity_monthly_calendar80_v1", "free_float_turnover_level_monthly_calendar80_v1", "free_float_turnover_abnormal_12m_calendar80_v1"]
operators = ["delay", "ts_mean", "ts_std", "ts_corr"]
maximum_candidates = 20
maximum_history = 252

[budget]
cache = "artifacts/research/p7_deepseek_cache.sqlite"
max_requests = 20
max_usd = 0.05
