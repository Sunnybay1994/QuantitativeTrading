[rules]
scope = "Repair all seven verified retained-holder share exchanges in the specified index. No live pointers, factors, running batches or strategy accounts are changed."
recognition = "At legal delisting, preserve the preceding close holding as a nontradable exchange claim under already published default terms. This is economic-right recognition, not an assertion about an unverified legal registration date."
cash_election = "No voluntary election is made; observed exercise by other named shareholders is not assigned to the benchmark."
pending_valuation = "Carry the predecessor's last book value without future successor prices. This is an explicit stale-book accounting convention, not observed fair value. Track its dates and weights."
pending_rebalance = "Keep pending claim units and book value unchanged. Rebalance only liquid opening capital to the original frozen target weights; no cash financing, forced disposal or write-off of the claim."
release = "Use only listing notices already available by the session and whose effective listing date has arrived, plus a positive-volume valid open/close bar. Lack of intraday evidence is a limitation of this daily reference, not proven execution."
merge = "Add delivered fractional successor units to existing successor units with a value-preserving blended prior mark before ordinary overnight/dividend/rebalance calculation."
fractional = "Fractional index shares; no household lottery or rounding rule is imposed on a continuous index."
dividends = "Preserve the original gross ex-date reinvestment convention. Reject an action on a pending successor or on the conversion date unless explicitly implemented; never silently double count."
other_inputs = "Original target plans, point-in-time membership, prices and ordinary dividends are reused. Unrelated suspension/missing-quote valuation conventions remain frozen."
seam = "Initialize normalized weights at a pre-event monthly close, reproduce frozen daily returns, repair through the first actual weight resynchronization, and verify five subsequent sessions. Reuse outside-window daily returns exactly; recompute continuous levels."
uncertainty = "Unknown legal registration/corporate cancellation dates stay null in evidence. A retained claim does not require inventing those dates. No assertion of true unobservable fair value while pending."

