[research]
hypothesis_id = "b32-fixed-stock-forward-observation-20260909"
conclusion = "RESEARCH_ONLY"
purpose = "Observe fixed B28 CV20 Top75-buffer monthly targets against paired same-effective-pool STD-/ROC+/RSV- monthly targets; neither is a PAPER_CANDIDATE."
frozen_backtest_cv20 = "artifacts/research/runs/9f181d7b2d92a6ef59608076b663e050812025ee4fcd2f392dcaefa6c052ef00"
no_parameter_changes_through = 2026-11-30

[paper]
start_date = 2026-09-10
initial_signal_date = 2026-09-09
end_date = 2026-11-30
initial_cash = 1000000.0
auto_trade = false
sell_only = false
halt = false
initial_holdings = "empty"
signal = "initial_completed_close_then_completed_month_end_close"
execution = "next_exchange_session_open"
valuation = "daily_close_cash_plus_holdings_plus_dividend_receivables"
daily_inputs_ready_hour_shanghai = 21
halt_behavior = "value_and_settle_but_no_orders_or_fills; missed_rebalance_not_retried"
sell_only_behavior = "permit_reductions_and_exits_only_no_new_or_increased_positions"
unfilled_orders = "record_rejection_no_retry_until_next_scheduled_rebalance"
