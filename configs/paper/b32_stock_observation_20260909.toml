end_behavior = "mark_final_date_do_not_force_liquidate_or_create_post_window_targets"

[data]
refresh_config = "configs/data/refresh.toml"
warmup_start = 2023-01-01
input_cutoff = "truncate_bars_and_daily_basic_at_each_signal_date_before_computation"
