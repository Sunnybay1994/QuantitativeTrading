# Read-only limits for the first order risk diagnostic; no strategy rule changes.
mode = "diagnostic_only"
auto_trade = false
refresh_config = "configs/data/refresh.toml"
liquidity_sessions = 20

[limits]
cash_buffer = 0.02
single_stock_weight = 0.10
industry_weight = 0.30
participation_rate = 0.05
maximum_liquidation_days = 5.0
