[research]
hypothesis_id = "b38-small-value-positive-roe-monthly-top50-20260909"
hypothesis = "Within the intersection of the smallest 30 percent circulating market caps and cheapest 50 percent positive PB ratios across the same complete eligible SH/SZ cohort, adding PIT ROE greater than zero improves compounded net 1x return over the unfiltered small-value Top50 while compounded 1x and 2x returns stay positive. Rank by smallest circulating cap, monthly, no tuning."
strategy_name = "b38_small_value_positive_roe_top50"
strategy_version = "v1"
random_seed = 20260909

[data]
refresh_config = "configs/data/refresh.toml"
warmup_start = 2023-01-01
research_start = 2023-07-01
research_end = 2026-09-08

[universe]
name = "all_sh_sz_historical_presence"
selection = "historical_presence_with_signal_date_eligibility"
freeze_start = 2023-01-01
freeze_end = 2026-09-08
minimum_observations = 120
minimum_average_amount = 20000000.0

[factors]
names = ["circulating_market_value"]
directions = [-1]
minimum_history_rows = 120
minimum_daily_symbols = 100

[composite]
method = "equal_weight_zscore_monthly"
standard_deviation_ddof = 0
zero_variance_component = "zero"
missing_component = "exclude_symbol"
winsorization = "none"

[portfolio]
top_k = 50
initial_cash = 1000000.0
cost_multipliers = [0.5, 1.0, 2.0]
rebalance = "month_end_close_next_session_open"
benchmark = "510300.SH"
benchmark_rebalance = "buy_and_hold"
stock_dividend_withholding = 0.20
# Unsold holdings are written down fully on the first session after delisting.
# Added during execution-data debugging, before any fold results were produced.
delisted_holding_recovery = 0.0
initial_signal = "previous_session_close"

[costs.a_share]
commission_rate = 0.00025
commission_min = 5.0
stamp_tax_sell = 0.0005
transfer_fee = 0.00001
slippage = 0.001
effective_from = 2023-08-28

[costs.etf]
commission_rate = 0.00025
commission_min = 5.0
slippage = 0.001
effective_from = 2023-01-01

[admission]
comparison = "small_value_unfiltered"
positive_net_return_1x = true
positive_net_return_2x = true
positive_paired_compound_increment_1x = true
maximum_conclusion = "RESEARCH_ONLY"

[small_value_quality]
small_fraction = 0.30
value_fraction = 0.50
quality_threshold = 0.0
quality_operator = "strictly_greater"
size_column = "circulating_market_value"
value_column = "pb"
quality_column = "pit_roe_ttm"
percentile_pool = "same_complete_positive_cap_positive_pb_finite_roe_after_historical_name_history_liquidity_filters"
intersection = "independent_size_and_value_ranks_in_full_eligible_cohort"
rounding = "ceiling"
ties = "symbol_ascending"
final_ranking = "smallest_circulating_market_value"
minimum_candidates = 50
parameter_grid = "one_fixed_30percent_50percent_positiveROE_configuration"
# All historically observed SH/SZ codes are enumerated, including delisted firms.
# Each signal still requires 120 observed rows, historical safe name, current liquidity,
# and PIT financials; a future IPO's mere presence in enumeration cannot select it early.
# freeze_start/end record the enumeration span in the existing run schema, not a
# claim that a 2026 constituent list was available in 2023.

[eligibility]
historical_exchange_name = true
exclude_st_or_delisting_name = true
unknown_historical_name = "exclude"

[financials]
ranking_requires_factors = ["pit_roe_ttm"]
snapshot_id = "b1_20260909_v2"
history_start = 2017-01-01
allowed_report_types = ["1"]
company_type = "1"
signal_frequency = "completed_month_end"
availability = "strictly_before_signal_date"
missing_quarter = "null"
# Monthly sparse RankIC observations, horizon 20 sessions; no daily forward-fill.
# Four fixed formulas and directions; no parameter grid or selection using test results.
# Type 1 is consolidated cumulative; conflicting revisions and invalid denominators are excluded.

[[walk_forward.folds]]
train_start = 2023-07-01
train_end = 2023-09-30
validation_start = 2023-10-01
validation_end = 2023-12-31
test_start = 2024-01-01
test_end = 2024-12-31

[[walk_forward.folds]]
train_start = 2023-07-01
train_end = 2023-12-31
validation_start = 2024-01-01
validation_end = 2024-12-31
test_start = 2025-01-01
test_end = 2025-12-31

[[walk_forward.folds]]
train_start = 2023-07-01
train_end = 2024-12-31
validation_start = 2025-01-01
validation_end = 2025-12-31
test_start = 2026-01-01
test_end = 2026-09-08
