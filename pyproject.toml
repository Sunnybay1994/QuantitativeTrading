[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant"
version = "0.1.0"
description = "A股/港股通个人量化投研交易系统(日频起步,研究与交易解耦)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "pandera[polars]>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "loguru>=0.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 免费数据源(M1 里程碑);第三方 SDK 只允许在 data/connectors/ 内部 import
data = [
    "akshare>=1.14",
    "baostock>=0.8",
    "tushare>=1.2.10",
]
# 研究面重依赖(M3 里程碑);不进入交易路径
research = [
    "mlflow>=2.12",
    "lightgbm>=4.3",
    "scikit-learn>=1.4",
    "quantstats>=0.0.62",
]
# Qlib 单独隔离：已在 py312 验收 Python/Qlib 兼容性；不进入 base 或交易运行时。
qlib = [
    "pyqlib>=0.9.7",
]
gui = ["streamlit>=1.48,<2"]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/quant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
